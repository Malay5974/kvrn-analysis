services:
  backend:
    build: ./backend
    environment:
      ELEXON_BASE_URL: https://data.elexon.co.uk/bmrs/api/v1
      ELEXON_TIMEOUT_SECONDS: 30
      ELEXON_MAX_ATTEMPTS: 5
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend
